[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ufc-odds-model"
version = "0.2.0"
description = "UFC data ingestion, point-in-time probability evaluation, and paper trading"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dashboard = ["streamlit==1.64.0"]
reports = ["reportlab==5.0.1"]
warehouse = [
    "pymysql[rsa]==1.2.3",
]

[project.scripts]
ufc-model = "ufc_odds_model.cli:main"
ufc-model-report = "ufc_odds_model.forecast_report:main"
ufc-statistics = "ufc_odds_model.statistics_workflow:main"
ufc-pipeline = "ufc_odds_model.pipeline_ops:main"
ufc-pipeline-demo = "ufc_odds_model.portfolio_demo:main"
ufc-warehouse = "ufc_odds_model.mysql_warehouse:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["ufc_odds_model*", "scripts*"]

[tool.setuptools.package-data]
ufc_odds_model = ["sql/migrations/*.sql"]
