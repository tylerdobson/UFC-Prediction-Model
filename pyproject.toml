[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ufc-odds-model"
version = "0.1.0"
description = "UFC moneyline data, Elo probabilities, and timestamped betting reports"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ufc-model = "ufc_odds_model.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ufc_odds_model = ["sql/migrations/*.sql"]
