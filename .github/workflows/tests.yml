name: Tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install uv==0.12.9
      - run: uv sync --frozen --python "$(which python)"
      - run: uv run --frozen python -m py_compile app.py
      - run: uv run --frozen python -m unittest discover -s tests -v

  dashboard-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.12.9
      - run: uv sync --frozen --extra dashboard --python "$(which python)"
      - run: uv run --frozen --extra dashboard python -m unittest discover -s tests -p test_dashboard_app.py -v
      - name: Served dashboard health check
        run: |
          uv run --frozen --extra dashboard python -m streamlit run app.py \
            --server.address 127.0.0.1 --server.port 8501 --server.headless true \
            > streamlit.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8501/_stcore/health; then
              exit 0
            fi
            sleep 1
          done
          cat streamlit.log
          exit 1

  container-smoke:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_ROOT_PASSWORD: ci_disposable_root
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: ufc_container
          MYSQL_USER: ufc_app
          MYSQL_PASSWORD: ci_disposable_application
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      UFC_DEPLOY_ROOT: ${{ github.workspace }}
      UFC_MODEL_DB: mysql:ci-dashboard
      UFC_MYSQL_HOST: 127.0.0.1
      UFC_MYSQL_PORT: "3306"
      UFC_MYSQL_DATABASE: ufc_container
      UFC_MYSQL_USER: ufc_app
      UFC_MYSQL_PASSWORD: ci_disposable_application
      UFC_MYSQL_SCHEMA_USER: root
      UFC_MYSQL_SCHEMA_PASSWORD: ci_disposable_root
      UFC_MYSQL_CONFIG_FILE: ${{ github.workspace }}/deploy/secrets/ci-mysql.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.12.9
      - run: uv sync --frozen --python "$(command -v python)"
      - name: Match container user to private host files
        run: |
          echo "UFC_DEPLOY_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "UFC_DEPLOY_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Provision isolated native MySQL schema and retained test receipt
        run: |
          uv run --frozen python - <<'PY'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          root = Path.cwd().resolve()
          sys.path.insert(0, str(root / "src"))
          from ufc_odds_model import mysql_runtime as runtime

          raw = root / "data/raw/ci-source.json"
          raw.parent.mkdir(parents=True)
          (root / "reports").mkdir(exist_ok=True)
          raw.write_bytes(b'{"fixture":"ci"}')
          raw.chmod(0o600)
          runtime.ensure_operating_dataset('ci-dashboard')
          with runtime.connect_dataset('mysql:ci-dashboard') as connection:
              connection.execute(
                  "INSERT INTO ingestion_runs(source, fetched_at_utc, payload_path, sha256) "
                  "VALUES (?, ?, ?, ?)",
                  ("ci-fixture", "2026-01-01T00:00:00Z", str(raw),
                   hashlib.sha256(raw.read_bytes()).hexdigest()),
              )
              connection.commit()
          config = Path(os.environ['UFC_MYSQL_CONFIG_FILE'])
          config.parent.mkdir(parents=True, exist_ok=True)
          config.write_text(json.dumps({'environment': {key: os.environ[key] for key in
              ('UFC_MYSQL_HOST','UFC_MYSQL_PORT','UFC_MYSQL_DATABASE','UFC_MYSQL_USER','UFC_MYSQL_PASSWORD')}}))
          config.chmod(0o600)
          PY
      - run: docker compose build dashboard
      - name: Serve native MySQL with read-only retained mounts
        run: |
          trap 'docker compose down --remove-orphans' EXIT
          docker compose up -d --no-build
          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:8501/_stcore/health; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8501/_stcore/health
          docker compose exec -T dashboard python - <<'PY'
          import os
          from ufc_odds_model.deployment import check_dashboard_deployment

          view = check_dashboard_deployment(os.environ['UFC_DEPLOY_ROOT'], os.environ['UFC_MODEL_DB'])
          assert view['status'] == 'ready', view['status']
          assert view['storage_backend'] == 'mysql'
          assert view['verified_receipts'] == 1
          assert not view['sqlite_fallback_used']
          PY
