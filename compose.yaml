name: ufc-prediction-model

services:
  dashboard:
    build: .
    image: ufc-prediction-dashboard:local
    # Match the host owner so private (0600) source payloads remain readable.
    user: "${UFC_DEPLOY_UID:?Set UFC_DEPLOY_UID from id -u}:${UFC_DEPLOY_GID:?Set UFC_DEPLOY_GID from id -g}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    environment:
      UFC_DEPLOY_ROOT: ${UFC_DEPLOY_ROOT:?Set UFC_DEPLOY_ROOT to the absolute checkout path}
      UFC_MODEL_DB: ${UFC_MODEL_DB:-mysql:operating}
      UFC_MODEL_EVALUATION_REPORT: ${UFC_DEPLOY_ROOT:?Set UFC_DEPLOY_ROOT}/reports/evaluation.json
      UFC_MODEL_RESEARCH_REPORT: ${UFC_DEPLOY_ROOT:?Set UFC_DEPLOY_ROOT}/reports/ufc_research_1993_2026_holdout.json
      UFC_MODEL_INTEGRITY_REPORT: ${UFC_DEPLOY_ROOT:?Set UFC_DEPLOY_ROOT}/reports/integrity.json
      UFC_MODEL_FORWARD_EVIDENCE_ROOT: ${UFC_DEPLOY_ROOT:?Set UFC_DEPLOY_ROOT}
      UFC_MODEL_FORWARD_SOURCE_ROOT: ${UFC_FORWARD_SOURCE_ROOT:-}
      UFC_MODEL_HISTORY_DB: ${UFC_MODEL_HISTORY_DB:-mysql:research-complete}
      UFC_MODEL_STATISTICS_DB: ${UFC_MODEL_STATISTICS_DB:-mysql:statistics}
      UFC_MYSQL_CONFIG: /run/ufc-secrets/mysql.json
      UFC_MYSQL_HOST: ${UFC_DOCKER_MYSQL_HOST:-host.docker.internal}
      UFC_MYSQL_PORT: ${UFC_MYSQL_PORT:-3307}
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_SERVER_FILE_WATCHER_TYPE: none
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    volumes:
      - type: bind
        source: ${UFC_MYSQL_CONFIG_FILE:?Set UFC_MYSQL_CONFIG_FILE to the private project MySQL config}
        target: /run/ufc-secrets/mysql.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${UFC_DEPLOY_ROOT:?Set UFC_DEPLOY_ROOT}/data
        target: ${UFC_DEPLOY_ROOT:?Set UFC_DEPLOY_ROOT}/data
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${UFC_DEPLOY_ROOT:?Set UFC_DEPLOY_ROOT}/reports
        target: ${UFC_DEPLOY_ROOT:?Set UFC_DEPLOY_ROOT}/reports
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${UFC_DEPLOY_ROOT:?Set UFC_DEPLOY_ROOT}/docs
        target: ${UFC_DEPLOY_ROOT:?Set UFC_DEPLOY_ROOT}/docs
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:8501:8501"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - runtime
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  runtime:
    driver: bridge
